[package]
name = "crime"
version = "0.1.0"
edition = "2024"
description = "A personal CRM for the terminal and AI assistants"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
crossterm = "0.29"
chrono = "0.4"
csv = "1.3"
directories = "6"
duckdb = { version = "1.4", features = ["bundled"] }
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shlex = "1"

tachyonfx = "0.25.2"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
